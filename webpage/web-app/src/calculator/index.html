<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <link rel="stylesheet" href="dark.css">
</head>
<body>
  <div class="CalcContainer">
      <aside class="sidebar-calc">
          <div class="Scientific-Calculator">
              <!-- Display -->
              <label for="display"></label>
              <input type="text" placeholder="0" id="display">

              <!-- Row 1 -->
              <div class="row">
                  <button onclick="Calculator.appendValue('Math.sin(')">sin</button>
                  <button onclick="Calculator.appendValue('Math.cos(')">cos</button>
                  <button onclick="Calculator.appendValue('Math.tan(')">tan</button>
                  <button onclick="Calculator.appendValue('Math.log(')">log</button>
                  <button onclick="Calculator.appendValue('Math.exp(')">exp</button>
              </div>

              <!-- Row 2 -->
              <div class="row">
                  <button onclick="Calculator.appendValue('7')">7</button>
                  <button onclick="Calculator.appendValue('8')">8</button>
                  <button onclick="Calculator.appendValue('9')">9</button>
                  <button onclick="Calculator.appendValue('/')">/</button>
                  <button onclick="Calculator.appendValue('(')">(</button>
              </div>

              <!-- Row 3 -->
              <div class="row">
                  <button onclick="Calculator.appendValue('4')">4</button>
                  <button onclick="Calculator.appendValue('5')">5</button>
                  <button onclick="Calculator.appendValue('6')">6</button>
                  <button onclick="Calculator.appendValue('*')">*</button>
                  <button onclick="Calculator.appendValue(')')">)</button>
              </div>

              <!-- Row 4 -->
              <div class="row">
                  <button onclick="Calculator.appendValue('1')">1</button>
                  <button onclick="Calculator.appendValue('2')">2</button>
                  <button onclick="Calculator.appendValue('3')">3</button>
                  <button onclick="Calculator.appendValue('-')">-</button>
                  <button onclick="Calculator.clearDisplay()">C</button>
              </div>

              <!-- Row 5 -->
              <div class="row">
                  <button onclick="Calculator.appendValue('0')">0</button>
                  <button onclick="Calculator.appendValue('.')">.</button>
                  <button onclick="Calculator.appendValue('+')">+</button>
                  <button onclick="Calculator.appendValue('Math.sqrt(')">√</button>
                  <button onclick="Calculator.appendValue('Math.pow(')">^</button>
              </div>

              <!-- Row 6 -->
              <div class="row">
                  <button onclick="Calculator.appendValue('Math.PI')">π</button>
                  <button onclick="Calculator.appendValue('Math.E')">e</button>
                  <button onclick="Calculator.appendValue('%')">%</button>
                  <button onclick="Calculator.appendValue('1/')">1/x</button>
                  <button onclick="Calculator.appendValue('**')">x²</button>
              </div>

              <!-- Row 7 -->
              <div class="row">
                  <button onclick="Calculator.appendValue('Math.floor(')">floor</button>
                  <button onclick="Calculator.appendValue('Math.ceil(')">ceil</button>
                  <button onclick="Calculator.appendValue('Math.abs(')">abs</button>
                  <button onclick="Calculator.appendValue('Math.round(')">round</button>
                  <button onclick="Calculator.appendValue('Math.random()')">rand</button>
              </div>

              <!-- Row 8 -->
              <div class="row">
                  <button onclick="Calculator.appendValue('Math.sin(Math.PI/2)')">sin90°</button>
                  <button onclick="Calculator.appendValue('Math.cos(Math.PI)')">cos180°</button>
                  <button onclick="Calculator.appendValue('Math.tan(Math.PI/4)')">tan45°</button>
                  <button onclick="Calculator.appendValue('Math.log10(')">log10</button>
                  <button onclick="Calculator.appendValue('Math.exp(1)')">e¹</button>
              </div>

              <!-- Row 9 -->
              <div class="row">
                  <button onclick="Calculator.calculate()" style="background-color:#4CAF50;color:white;">=</button>
                  <button onclick="Calculator.clearDisplay()" style="background-color:#f44336;color:white;">AC</button>
                  <button onclick="Calculator.appendValue('**0.5')">√x</button>
                  <button onclick="Calculator.appendValue('Math.pow(')">xʸ</button>
                  <button onclick="Calculator.appendValue('Math.log(')">ln</button>
              </div>

              <div class="row">
                  <button>Ac</button>
                  <button>Ce</button>
                  <button>0</button>
                  <button>00</button>
              </div>
          </div>
      </aside>

      <main class="plot-area">
          <div id="plot-container">
              <h2>Graph Plotter</h2>
              <p>Plot will be displayed here...</p>
          </div>
      </main>
</div>
  <script src="calculator.js"></script>
</body>
</html>
